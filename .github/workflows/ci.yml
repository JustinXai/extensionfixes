name: ExtensionFixes CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: extensionfixes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Build, Review, Local Text QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Content review
        run: npm run review

      - name: Local text QA
        run: npm run check:local:text
